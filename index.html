<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy birthday to yuo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* 密码输入页：白底、黑字 */
    .lock-page {
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
    }
    .lock-page h2 {
      font-weight: normal;
    }
    .lock-page input {
      border: 1px solid #333;
      color: #000;
      padding: 12px;
      font-size: 16px;
      width: 220px;
      border-radius: 6px;
      outline: none;
    }
    .lock-page button {
      border: 1px solid #000;
      background: #fff;
      color: #000;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .error-tip {
      color: #000;
      display: none;
    }
    /* 解锁之后的页面 */
    .secret-page {
      display: none;
      background: #000;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .secret-page img {
      max-width: 95vw;
      max-height: 95vh;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

    <h2>请输入访问密码</h2>
    <input type="password" id="pwdInput" placeholder="输入密码">
    <button onclick="checkPwd()">进入</button>
    <div class="error-tip" id="errTip">密码错误</div>
  </div>
